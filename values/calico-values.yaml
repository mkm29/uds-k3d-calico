installation:
  cni:
    type: Calico
  calicoNetwork:
    # bgp: Disabled
    linuxDataplane: "BPF"
    hostPorts: null
    containerIPForwarding: Enabled
    ipPools:
    - cidr: "###ZARF_VAR_POD_CIDR###"
      encapsulation: VXLANCrossSubnet
      natOutgoing: Enabled
      nodeSelector: all()

defaultFelixConfiguration:
  enabled: true  # Required to override BPF settings for k3d environment
  bpfConnectTimeLoadBalancing: "Disabled"  # Prevents conflicts with kube-proxy in k3d
  bpfExternalServiceMode: "Tunnel"  # DSR not compatible with k3d's containerized network
  bpfKubeProxyIptablesCleanupEnabled: false  # k3d requires kube-proxy coexistence

certs:
  node:
    key: null
    cert: null
    commonName: null
  typha:
    key: null
    cert: null
    commonName: null
    caBundle: null

kubernetesServiceEndpoint:
  host: "###ZARF_VAR_KUBERNETES_SVC_ENDPOINT_HOST###"
  port: "###ZARF_VAR_KUBERNETES_SVC_ENDPOINT_PORT###"